<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,maximum-scale=1.0,user-scalable=no">
<title>英核</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="英核">
<meta name="theme-color" content="#0f1419">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icon-120.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--ink:#0f1419;--ink-2:#1a2129;--ink-3:#232c36;--ink-4:#2e3a46;--paper:#eef2f4;--paper-dim:#8a97a3;--paper-faint:#5b6772;--glow:#f4c95d;--glow-soft:#f4c95d22;--done:#5fd0a0;--done-soft:#5fd0a01a;--blue:#6db3e8;--red:#e85a5a;--red-soft:#e85a5a1a;--radius:18px;--radius-sm:12px;--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{background:var(--ink);color:var(--paper);font-family:var(--font);line-height:1.5;padding:calc(env(safe-area-inset-top)+8px) max(env(safe-area-inset-right),16px) calc(env(safe-area-inset-bottom)+24px) max(env(safe-area-inset-left),16px);width:100%;max-width:520px;margin:0 auto;min-height:100vh;-webkit-text-size-adjust:100%;}
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 2px 16px;}
.title{font-size:20px;font-weight:700;letter-spacing:.5px;}
.title .dot{color:var(--glow);}
.today{font-size:13px;color:var(--paper-dim);text-align:right;}
.tabs{display:flex;gap:6px;background:var(--ink-2);padding:4px;border-radius:var(--radius-sm);margin-bottom:20px;position:sticky;top:0;z-index:50;}
.tab{flex:1;text-align:center;padding:9px;font-size:13px;font-weight:600;color:var(--paper-dim);border-radius:9px;cursor:pointer;transition:all .2s;}
.tab.active{background:var(--ink-4);color:var(--paper);}
.page{display:none;}
.page.active{display:block;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}50%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.ring-wrap{display:flex;flex-direction:column;align-items:center;margin:4px 0 12px;}
.ring{position:relative;width:min(150px,44vw);aspect-ratio:1;}
.ring svg{transform:rotate(-90deg);display:block;width:100%;height:100%;}
.ring-track{fill:none;stroke:var(--ink-3);stroke-width:12;}
.ring-fill{fill:none;stroke:var(--glow);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .7s ease;}
.ring-fill.complete{stroke:var(--done);}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.streak-num{font-size:clamp(34px,11vw,48px);font-weight:800;line-height:1;letter-spacing:-2px;}
.streak-num.complete{color:var(--done);}
.streak-label{font-size:12px;color:var(--paper-dim);margin-top:4px;}
.streak-sub{font-size:11px;color:var(--paper-faint);margin-top:2px;}
.task-card{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .2s;}
.task-card:active{transform:scale(.98);}
.task-card .icon{font-size:20px;width:28px;text-align:center;}
.task-card .info{flex:1;min-width:0;}
.task-card .info .name{font-size:14px;font-weight:600;}
.task-card .info .desc{font-size:12px;color:var(--paper-faint);margin-top:2px;}
.task-card .status{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
.task-card .status.done{background:var(--done-soft);color:var(--done);}
.task-card .status.pending{background:var(--glow-soft);color:var(--glow);}
.stats{display:flex;gap:10px;margin-top:18px;}
.stat{flex:1;background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--radius-sm);padding:12px;text-align:center;}
.stat .n{font-size:22px;font-weight:800;}
.stat .n.glow{color:var(--glow);}
.stat .l{font-size:11px;color:var(--paper-faint);margin-top:2px;}
.level-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;margin-left:6px;cursor:pointer;border:none;font-family:var(--font);transition:opacity .2s;}
.lv-cet4{background:#6db3e833;color:var(--blue);}
.lv-cet6{background:#f4c95d33;color:var(--glow);}
.lv-ielts{background:#5fd0a033;color:var(--done);}
.lv-toefl{background:#e85a5a33;color:var(--red);}
.word-card{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:14px;}
.word-card .word{font-size:28px;font-weight:700;letter-spacing:-.5px;cursor:pointer;}
.word-card .phonetic{font-size:14px;color:var(--paper-dim);margin-top:4px;}
.word-card .meaning{font-size:18px;color:var(--paper);margin-top:12px;}
.word-card .example{font-size:13px;color:var(--paper-dim);line-height:1.6;margin-top:12px;padding-top:12px;border-top:1px solid var(--ink-3);}
.quiz-options{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.quiz-opt{padding:12px 16px;border-radius:var(--radius-sm);background:var(--ink-3);border:1px solid transparent;font-size:14px;cursor:pointer;transition:all .2s;text-align:left;font-family:var(--font);color:var(--paper);}
.quiz-opt:active{transform:scale(.98);}
.quiz-opt.correct{border-color:var(--done);background:var(--done-soft);color:var(--done);}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red);}
.quiz-opt.reveal{border-color:var(--done);}
.progress-bar{height:4px;background:var(--ink-3);border-radius:2px;margin:12px 0;overflow:hidden;}
.progress-bar .fill{height:100%;background:var(--glow);border-radius:2px;transition:width .4s ease;}
.word-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;}
.word-list-item{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:8px;padding:10px;font-size:12px;cursor:pointer;transition:all .2s;}
.word-list-item:active{transform:scale(.97);}
.word-list-item .en{font-weight:600;}
.word-list-item .cn{color:var(--paper-faint);font-size:11px;margin-top:2px;}
.word-list-item .stage{font-size:10px;color:var(--glow);margin-top:1px;}
.sentence-card{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--radius);padding:20px;margin-bottom:14px;text-align:center;}
.sentence-card .en{font-size:18px;font-weight:600;line-height:1.5;}
.sentence-card .cn{font-size:15px;color:var(--paper-dim);margin-top:10px;}
.sentence-card .actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
.action-btn{padding:8px 18px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;}
.action-btn:active{transform:scale(.97);}
.action-btn.play{background:var(--glow);color:var(--ink);}
.action-btn.show-cn{background:var(--ink-4);color:var(--paper-dim);}
.action-btn.done{background:var(--done);color:var(--ink);}
.speak-card{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--radius);padding:20px;margin-bottom:14px;}
.speak-card .topic{font-size:16px;font-weight:600;margin-bottom:10px;}
.speak-card .prompt{font-size:13px;color:var(--paper-dim);line-height:1.6;margin-bottom:14px;}
.speak-btn{width:100%;padding:12px;border-radius:var(--radius-sm);border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;margin-bottom:8px;}
.speak-btn:active{transform:scale(.98);}
.speak-btn.play{background:var(--glow);color:var(--ink);}
.speak-btn.record{background:var(--ink-3);color:var(--paper);}
.speak-btn.stop{background:var(--red);color:white;}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px;}
.cal-head{text-align:center;font-size:10px;color:var(--paper-faint);padding:4px 0;font-weight:600;}
.cal-day{aspect-ratio:1;border-radius:8px;background:var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--paper-faint);cursor:pointer;transition:background .2s;}
.cal-day.today{outline:2px solid var(--glow);outline-offset:1px;}
.cal-day.done{background:var(--done-soft);color:var(--done);font-weight:600;}
.cal-day.future{opacity:.3;}
.month-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.month-stat{background:var(--ink-2);border:1px solid var(--ink-3);border-radius:var(--radius-sm);padding:10px;text-align:center;}
.month-stat .v{font-size:18px;font-weight:700;color:var(--glow);}
.month-stat .l{font-size:10px;color:var(--paper-faint);margin-top:2px;}
.dialog-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;align-items:center;justify-content:center;}
.dialog-overlay.show{display:flex;}
.dialog{background:var(--ink-2);border:1px solid var(--ink-4);border-radius:var(--radius);padding:24px;width:88%;max-width:360px;animation:pop .25s ease;}
.dialog h3{margin:0 0 12px;font-size:16px;}
.dialog p{font-size:13px;color:var(--paper-dim);line-height:1.6;margin:0 0 16px;}
.dialog .d-btn{width:100%;padding:10px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);margin-top:6px;transition:opacity .15s;}
.dialog .d-btn:active{opacity:.7;}
.dialog .d-btn.primary{background:var(--glow);color:var(--ink);}
.dialog .d-btn.sec{background:var(--ink-3);color:var(--paper-dim);}
.btn-s{flex:1;background:var(--ink-2);border:1px solid var(--ink-3);color:var(--paper-dim);border-radius:var(--radius-sm);padding:13px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:all .2s;}
.btn-s:active{border-color:var(--glow);color:var(--paper);}
</style>
</head>
<body>

<div class="top">
  <div class="title">英核<span class="dot">.</span></div>
  <div class="today" id="todayDate"></div>
</div>

<div class="tabs">
  <div class="tab active" data-page="today">今日</div>
  <div class="tab" data-page="vocab">单词</div>
  <div class="tab" data-page="listen">精听</div>
  <div class="tab" data-page="speak">口语</div>
  <div class="tab" data-page="review">统计</div>
</div>

<div class="page active" id="page-today">
  <div class="ring-wrap">
    <div class="ring">
      <svg width="150" height="150" viewBox="0 0 150 150">
        <circle class="ring-track" cx="75" cy="75" r="63"></circle>
        <circle class="ring-fill" id="ringFill" cx="75" cy="75" r="63"></circle>
      </svg>
      <div class="ring-center">
        <div class="streak-num" id="streakNum">0</div>
        <div class="streak-label">连续学习</div>
        <div class="streak-sub" id="ringSub">完成 0/4</div>
      </div>
    </div>
  </div>
  <div id="todayTasks"></div>
  <div class="stats">
    <div class="stat"><div class="n glow" id="stStreak">0</div><div class="l">当前连续</div></div>
    <div class="stat"><div class="n" id="stWords">0</div><div class="l">已学词</div></div>
    <div class="stat"><div class="n" id="stRate">0%</div><div class="l">正确率</div></div>
  </div>
</div>

<div class="page" id="page-vocab">
  <div class="progress-bar"><div class="fill" id="vpFill" style="width:0%"></div></div>
  <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
    <button class="level-tag lv-cet4" onclick="setLevel('CET4')" id="lvCET4">CET4</button>
    <button class="level-tag lv-cet6" onclick="setLevel('CET6')" id="lvCET6">CET6</button>
    <button class="level-tag lv-ielts" onclick="setLevel('IELTS')" id="lvIELTS">IELTS</button>
    <button class="level-tag lv-toefl" onclick="setLevel('TOEFL')" id="lvTOEFL">TOEFL</button>
    <span style="flex:1;text-align:right;font-size:12px;color:var(--paper-faint);align-self:center" id="vcCount"></span>
  </div>
  <div id="vocabContent"></div>
</div>

<div class="page" id="page-listen">
  <div id="listenContent"></div>
</div>

<div class="page" id="page-speak">
  <div id="speakContent"></div>
</div>

<div class="page" id="page-review">
  <div style="display:flex;gap:6px;margin-bottom:12px;">
    <div class="view-btn" style="flex:1;text-align:center;padding:8px;font-size:12px;font-weight:600;color:var(--paper-dim);border-radius:8px;cursor:pointer;background:var(--ink-4);color:var(--paper);" onclick="swRev('cal')">日历</div>
    <div class="view-btn" style="flex:1;text-align:center;padding:8px;font-size:12px;font-weight:600;color:var(--paper-dim);border-radius:8px;cursor:pointer;" onclick="swRev('words')">词汇</div>
    <div class="view-btn" style="flex:1;text-align:center;padding:8px;font-size:12px;font-weight:600;color:var(--paper-dim);border-radius:8px;cursor:pointer;" onclick="swRev('backup')">备份</div>
  </div>
  <div id="revContent"></div>
  <input type="file" id="importFile" accept=".csv,.json" style="display:none">
</div>

<div class="dialog-overlay" id="dialog" onclick="if(event.target===this)closeD()">
  <div class="dialog">
    <h3 id="dTitle"></h3>
    <p id="dBody"></p>
    <button class="d-btn primary" id="dBtn1" onclick="closeD()">确定</button>
  </div>
</div>

<script>
var STORE_KEY='yh2',vocabData=[],sentData=[],curLevel='CET4',quizMode='learn',qWords=[],qIdx=0,qCor=0;
var listenQ=[],speakIdx=0,revView='cal',answ=false;

function loadData(){try{var r=localStorage.getItem(STORE_KEY);return r?JSON.parse(r):{start:null,rec:{},ws:{},level:'CET4',lu:[]};}catch(e){return{start:null,rec:{},ws:{},level:'CET4',lu:[]};}}
function sv(d){try{localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch(e){}}
var D=loadData();curLevel=D.level||'CET4';

function td(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function loadJ(u,cb){var x=new XMLHttpRequest();x.open('GET',u,true);x.onload=function(){try{cb(JSON.parse(x.responseText));}catch(e){cb([]);}};x.onerror=function(){cb([]);};x.send();}

function getWS(w){
  if(!D.ws)D.ws={};
  if(!D.ws[w])D.ws[w]={n:0,int:1,nxt:td(),lst:null};
  if(!D.ws[w].nxt)D.ws[w].nxt=td();
  return D.ws[w];
}
function updWS(w,cor){
  var s=getWS(w);s.lst=td();
  if(cor){s.n++;s.int=[1,3,7,14,30,60,120][Math.min(s.n,6)]||180;}
  else{s.n=0;s.int=1;}
  var d=new Date();d.setDate(d.getDate()+s.int);s.nxt=d.toISOString().slice(0,10);
  D.ws[w]=s;sv(D);
}
function dueW(){
  var t=td(),lvl=D.level||'CET4',lw=vocabData.filter(function(w){return w.level===lvl;});
  if(lw.length===0&&vocabData.length>0)lw=vocabData.filter(function(w){return w.level==='CET4';});
  var due=[];for(var i=0;i<lw.length;i++){var s=getWS(lw[i].word);if(s.nxt<=t&&s.n<6)due.push(lw[i]);}return due;
}
function newW(c){
  var t=td(),lvl=D.level||'CET4',lw=vocabData.filter(function(w){return w.level===lvl;});
  if(lw.length===0&&vocabData.length>0)lw=vocabData.filter(function(w){return w.level==='CET4';});
  var un=[];for(var i=0;i<lw.length;i++){var s=getWS(lw[i].word);if(!s.lst)un.push(lw[i]);}return un.slice(0,c);
}
function tWords(){var d=dueW(),n=newW(5-d.length>0?5-d.length:0);return{d:d,n:n,c:d.length+n.length};}
function lQueue(){
  var t=td(),lvl='beginner';
  var td2=0;for(var k in D.rec)if(D.rec[k].indexOf('listen')!==-1)td2++;
  if(td2>5)lvl='intermediate';
  var c=sentData.filter(function(s){return s.level===lvl;});
  if(c.length<2)c=sentData;
  var used=D.lu||[],fr=c.filter(function(s){return used.indexOf(s.id)===-1;});
  if(fr.length<2)fr=c;return fr.slice(0,2);
}
function sTopic(){var ts=[{t:'自我介绍',p:'Introduce yourself: name, work, hobbies.'},{t:'描述今天',p:'Describe your day from morning to night.'},{t:'我的工作',p:'Describe your job or study. What do you do daily?'},{t:'旅行经历',p:'Talk about a trip. Where and what did you do?'},{t:'未来计划',p:'What are your plans for the future?'},{t:'最喜欢的',p:'Talk about your favorite movie or book.'}];return ts[speakIdx%ts.length];}

function doneCnt(){var r=D.rec[td()]||[];return r.length;}
function allDone(){return doneCnt()>=4;}
function setDone(t){
  var k=td();if(!D.start)D.start=k;if(!D.rec[k])D.rec[k]=[];
  if(D.rec[k].indexOf(t)===-1)D.rec[k].push(t);sv(D);
}
function streak(){
  var s=0,d=new Date();
  if(!allDone())d.setDate(d.getDate()-1);
  while(true){var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);if(D.rec[k]&&D.rec[k].length>=4){s++;d.setDate(d.getDate()-1);}else break;}return s;
}
function wLearn(){var c=0;for(var k in D.ws)if(D.ws[k].n>0)c++;return c;}
function avgRate(){var t=0,c=0;for(var k in D.ws){var s=D.ws[k];if(s.n>0){t+=s.n;c++;}}return c>0?Math.round(t/(t+c)*100):0;}

function rToday(){
  var n=new Date();document.getElementById('todayDate').textContent=(n.getMonth()+1)+'月'+n.getDate()+'日 周'+['日','一','二','三','四','五','六'][n.getDay()];
  var dc=doneCnt(),ad=allDone();
  var fill=document.getElementById('ringFill');var r=63,circ=2*Math.PI*r;fill.style.strokeDasharray=circ;fill.style.strokeDashoffset=circ*(1-dc/4);
  fill.classList.toggle('complete',ad);
  var st=streak();document.getElementById('streakNum').textContent=st;document.getElementById('streakNum').classList.toggle('complete',ad);
  document.getElementById('ringSub').textContent='完成 '+dc+'/4';
  var tw=tWords(),lq=lQueue(),st2=sTopic();
  var html='';
  var tasks=[{id:'word',ic:'📖',nm:'学新词',de:tw.n.length>0?tw.n.length+'个新词 + '+tw.d.length+'个复习':'复习 '+tw.d.length+'个词'},{id:'review',ic:'🔄',nm:'复习巩固',de:'待复习 '+tw.d.length+' 个词'},{id:'listen',ic:'👂',nm:'精听练习',de:lq.length+'句今日精听'},{id:'speak',ic:'🎤',nm:'开口练习',de:'主题：'+st2.t}];
  for(var i=0;i<tasks.length;i++){
    var t=tasks[i],dn=D.rec[td()]&&D.rec[td()].indexOf(t.id)!==-1;
    html+='<div class="task-card" onclick="goTab('+(i+1)+')"><div class="icon">'+t.ic+'</div><div class="info"><div class="name">'+t.nm+'</div><div class="desc">'+t.de+'</div></div><div class="status'+(dn?' done':' pending')+'">'+(dn?'✓ 已完成':'去学习')+'</div></div>';
  }
  document.getElementById('todayTasks').innerHTML=html;
  document.getElementById('stStreak').textContent=st;
  document.getElementById('stWords').textContent=wLearn();
  document.getElementById('stRate').textContent=avgRate()+'%';
}
function goTab(i){var tabs=document.querySelectorAll('.tab');if(i<tabs.length)swT(i);}

function setLevel(lv){
  curLevel=lv;D.level=lv;sv(D);
  document.querySelectorAll('#page-vocab .level-tag').forEach(function(e){e.style.opacity=e.textContent===lv?'1':'0.4';});
  rVocab();
}
function rVocab(){
  var lvl=D.level||'CET4',lw=vocabData.filter(function(w){return w.level===lvl;});
  if(lw.length===0&&vocabData.length>0){var fallback=vocabData[0].level;lvl=fallback;D.level=fallback;sv(D);lw=vocabData.filter(function(w){return w.level===lvl;});}
  document.getElementById('vcCount').textContent=lw.length+'词';
  ['CET4','CET6','IELTS','TOEFL'].forEach(function(l){var e=document.getElementById('lv'+l);if(e)e.style.opacity=l===lvl?'1':'0.4';});
  var tw=tWords(),learned=0;
  for(var i=0;i<lw.length;i++){var s=getWS(lw[i].word);if(s.n>0)learned++;}
  var pct=lw.length>0?Math.round(learned/lw.length*100):0;
  document.getElementById('vpFill').style.width=pct+'%';document.getElementById('vpFill').classList.toggle('done',pct>=100);
  var html='';
  if(quizMode==='learn'){
    var due=dueW(),nw=newW(5);
    html+='<div style="display:flex;gap:6px;margin-bottom:10px;"><button class="btn-s" style="background:var(--glow);color:var(--ink);border:none;" onclick="startQ()">开始学习</button><button class="btn-s" onclick="quizMode=\'list\';rVocab();">词库</button></div>';
    if(due.length+nw.length>0){
      html+='<div class="word-list">';
      var all=due.concat(nw);
      for(var i=0;i<all.length;i++){
        var w=all[i];
        html+='<div class="word-list-item" onclick="playS(\''+w.word+'\')"><div class="en">'+w.word+'</div><div class="cn">'+(w.meaning.length>20?w.meaning.slice(0,20):w.meaning)+'</div><div class="stage">'+(getWS(w.word).n>0?'复习中':'新词')+'</div></div>';
      }
      html+='</div>';
    }else html+='<div style="text-align:center;padding:30px;color:var(--paper-faint);font-size:13px;">该级别所有词已学完！🎉</div>';
  }else if(quizMode==='quiz'){html=rQuiz();}
  else{
    html+='<div style="margin-bottom:10px;"><button class="btn-s" style="background:var(--glow);color:var(--ink);border:none;" onclick="quizMode=\'learn\';rVocab();">返回学习</button></div><div class="word-list">';
    for(var i=0;i<lw.length;i++){var w=lw[i],s=getWS(w.word);
      html+='<div class="word-list-item" onclick="playS(\''+w.word+'\')"><div class="en">'+w.word+'</div><div class="cn">'+(w.meaning.length>20?w.meaning.slice(0,20):w.meaning)+'</div><div class="stage">'+(s.n>0?'已学':'未学')+'</div></div>';
    }
    html+='</div>';
  }
  document.getElementById('vocabContent').innerHTML=html;
}
function startQ(){
  var due=dueW(),nw=newW(5);qWords=due.concat(nw);
  if(qWords.length===0){quizMode='list';rVocab();showD('提示','该级别暂无待学词汇，切换级别或已全部学完。');return;}
  qIdx=0;qCor=0;quizMode='quiz';rVocab();
  // Read the first word aloud
  if(qWords.length>0)setTimeout(function(){playS(qWords[0].word);},300);
}
function rQuiz(){
  if(qIdx>=qWords.length){
    setDone('word');setDone('review');
    showD('🎉完成',qCor+'/'+qWords.length+' 正确率 '+Math.round(qCor/qWords.length*100)+'%');
    setTimeout(function(){quizMode='learn';rVocab();rToday();},500);return'';
  }
  var w=qWords[qIdx];
  var lvl=D.level||'CET4',pool=vocabData.filter(function(v){return v.level===lvl;});
  if(pool.length===0){var all=vocabData.filter(function(v){return v.level==='CET4';});pool=all.length>0?all:vocabData;}
  var opts=[{t:w.meaning,c:true}],used=[w.word];
  while(opts.length<4){var ri=Math.floor(Math.random()*pool.length);if(used.indexOf(pool[ri].word)===-1){opts.push({t:pool[ri].meaning,c:false});used.push(pool[ri].word);}}
  for(var i=opts.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),tmp=opts[i];opts[i]=opts[j];opts[j]=tmp;}
  answ=false;
  var h='<div class="word-card"><div class="word" onclick="playS(\''+w.word+'\')">'+w.word+'</div><div class="phonetic">'+w.phonetic+'</div><div class="meaning" id="qm" style="display:none">'+w.meaning+'</div><div class="example">'+w.example_en+'<br><span style="color:var(--paper-faint)">'+w.example_cn+'</span></div><div class="quiz-options">';
  for(var i=0;i<opts.length;i++)h+='<div class="quiz-opt" data-c="'+(opts[i].c?'1':'0')+'" onclick="aQ(this)">'+opts[i].t+'</div>';
  h+='</div></div><div style="text-align:center;font-size:12px;color:var(--paper-faint);">'+(qIdx+1)+'/'+qWords.length+'</div>';
  return h;
}
function aQ(el){
  if(answ)return;answ=true;var cor=el.dataset.c==='1';
  if(cor){el.classList.add('correct');qCor++;}else el.classList.add('wrong');
  document.querySelectorAll('#page-vocab .quiz-opt').forEach(function(e){if(e.dataset.c==='1')e.classList.add('reveal');});
  var w=qWords[qIdx];updWS(w.word,cor);
  document.getElementById('qm').style.display='block';
  setTimeout(function(){answ=false;qIdx++;rVocab();if(qIdx<qWords.length)setTimeout(function(){playS(qWords[qIdx].word);},400);},1200);
}
function playS(w){if('speechSynthesis'in window){var u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=0.85;speechSynthesis.speak(u);}}

function rListen(){
  var q=lQueue();listenQ=q;
  if(q.length===0){document.getElementById('listenContent').innerHTML='<div style="text-align:center;padding:30px;color:var(--paper-faint);">暂无精听内容</div>';return;}
  var h='';
  for(var i=0;i<q.length;i++){var s=q[i];
    h+='<div class="sentence-card"><div class="en">'+s.en+'</div><div class="cn" id="lcn'+i+'" style="display:none">'+s.cn+'</div><div class="actions"><button class="action-btn play" onclick="pL('+i+')">🔊 听</button><button class="action-btn show-cn" onclick="document.getElementById(\'lcn'+i+'\').style.display=\'block\'">中文</button><button class="action-btn done" onclick="mL('+i+')">✓ 听懂了</button></div></div>';
  }
  document.getElementById('listenContent').innerHTML=h;
}
function pL(i){
  var s=listenQ[i];if(!s)return;
  if('speechSynthesis'in window){
    speechSynthesis.cancel();
    setTimeout(function(){
      var u=new SpeechSynthesisUtterance(s.en);u.lang='en-US';u.rate=0.8;
      speechSynthesis.speak(u);
    },100);
  }
}
function mL(i){
  if(!D.lu)D.lu=[];if(D.lu.indexOf(listenQ[i].id)===-1)D.lu.push(listenQ[i].id);setDone('listen');
  if(i+1<listenQ.length){pL(i+1);closeD();}else{showD('✓','今日精听完成！');rToday();}
}

function rSpeak(){
  var tp=sTopic();
  var h='<div class="speak-card"><div class="topic">🎤 '+tp.t+'</div><div class="prompt">'+tp.p+'</div>'
    +'<button class="speak-btn play" onclick="sEx(\''+tp.t+'\')">🔊 听示范</button>'
    +'<button class="speak-btn record" id="spBtn" onclick="tRec()">🎙 开始录音</button>'
    +'<div style="font-size:12px;color:var(--paper-faint);text-align:center;margin-top:10px;" id="spStat">点击录音，说完后停止</div>'
    +'<div style="display:flex;gap:6px;margin-top:10px;"><button class="speak-btn play" style="width:auto;flex:1;padding:10px;font-size:13px;" onclick="speakIdx++;rSpeak();">换话题</button>'
    +'<button class="speak-btn record" style="width:auto;flex:1;padding:10px;font-size:13px;background:var(--done);color:var(--ink);" onclick="setDone(\'speak\');showD(\'✓\',\'开口练习完成！\');rToday();">练完了</button></div></div>';
  document.getElementById('speakContent').innerHTML=h;
}
function sEx(t){
  if('speechSynthesis'in window){
    speechSynthesis.cancel();
    var enText='',cnText='';
    if(t.indexOf('介绍')!==-1){enText='Hi, my name is Tom. I am a student. I like reading and swimming.';cnText='你好，我叫Tom。我是一名学生，喜欢阅读和游泳。';}
    else if(t.indexOf('今天')!==-1){enText='Today I woke up at seven. I had breakfast and went to work.';cnText='今天我7点起床，吃了早餐然后去上班。';}
    else if(t.indexOf('工作')!==-1){enText='I work as a software engineer. I enjoy my job very much.';cnText='我是一名软件工程师，我非常喜欢我的工作。';}
    else if(t.indexOf('旅行')!==-1){enText='Last summer I traveled to Beijing. I visited the Great Wall. It was amazing.';cnText='去年夏天我去了北京旅行，参观了长城，非常壮观。';}
    else if(t.indexOf('未来')!==-1){enText='In the future, I want to travel around the world and learn new things.';cnText='未来我想环游世界，学习新东西。';}
    else if(t.indexOf('喜欢')!==-1){enText='My favorite movie is The Matrix. It is a very interesting science fiction film.';cnText='我最喜欢的电影是《黑客帝国》，是一部非常有趣的科幻片。';}
    else{enText='Hello, welcome to English practice. Keep learning every day.';cnText='你好，欢迎来到英语练习。每天坚持学习。';}
    // Show bilingual text in the card
    var status=document.getElementById('spStat');
    if(status)status.innerHTML='📖 <b>'+enText+'</b><br><span style="color:var(--paper-faint)">'+cnText+'</span>';
    setTimeout(function(){
      var u=new SpeechSynthesisUtterance(enText);
      u.lang='en-US';u.rate=0.85;
      speechSynthesis.speak(u);
    },100);
  }
}
var recog=null;
function tRec(){
  var btn=document.getElementById('spBtn');
  if(recog&&recog.running){recog.stop();document.getElementById('spStat').textContent='已停止。';btn.textContent='🎙 重新录音';btn.className='speak-btn record';return;}
  if(!('webkitSpeechRecognition'in window)&&!('SpeechRecognition'in window)){document.getElementById('spStat').textContent='⚠ 当前浏览器不支持，请用Chrome。';return;}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;recog=new SR();recog.lang='en-US';recog.continuous=false;recog.interimResults=true;recog.running=true;
  recog.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;document.getElementById('spStat').textContent='你说的是："'+t+'"';};
  recog.onerror=function(){document.getElementById('spStat').textContent='出错请重试。';btn.textContent='🎙 录音';};
  recog.onend=function(){recog.running=false;};
  recog.start();btn.textContent='⏹ 停止';btn.className='speak-btn stop';document.getElementById('spStat').textContent='🎙 录音中...';
}

function swRev(v){revView=v;rRev();}
function rRev(){
  var h='';
  if(revView==='cal'){var n=new Date(),y=n.getFullYear(),m=n.getMonth(),first=new Date(y,m,1).getDay(),off=(first===0?6:first-1),days=new Date(y,m+1,0).getDate(),tk=td();
    var cal='<h3 style="font-size:14px;font-weight:600;margin:0 0 4px;">'+y+'年'+(m+1)+'月</h3><div class="calendar-grid"><div class="cal-head">一</div><div class="cal-head">二</div><div class="cal-head">三</div><div class="cal-head">四</div><div class="cal-head">五</div><div class="cal-head">六</div><div class="cal-head">日</div>';
    for(var i=0;i<off;i++)cal+='<div class="cal-day future"></div>';
    var dd=0,tdy=0;
    for(var d=1;d<=days;d++){var date=new Date(y,m,d),key=date.getFullYear()+'-'+('0'+(date.getMonth()+1)).slice(-2)+'-'+('0'+date.getDate()).slice(-2);var rec=D.rec[key],done=rec&&rec.length>=4;
      cal+='<div class="cal-day'+(key===tk?' today':'')+(done?' done':'')+(key>tk?' future':'')+'" onclick="showD(key,\''+key+'\')">'+d+'</div>';if(key<=tk){tdy++;if(done)dd++;}}
    cal+='</div><div class="month-stats"><div class="month-stat"><div class="v">'+dd+'</div><div class="l">学习天数</div></div><div class="month-stat"><div class="v">'+streak()+'</div><div class="l">当前连续</div></div><div class="month-stat"><div class="v">'+Math.round(dd/(tdy||1)*100)+'%</div><div class="l">完成率</div></div><div class="month-stat"><div class="v">'+wLearn()+'</div><div class="l">已学词汇</div></div></div>';
    h=cal;
  }else if(revView==='words'){
    var lvl=D.level||'CET4',lw=vocabData.filter(function(w){return w.level===lvl;}),learned=0,s1=0,s2=0,s3=0;
    for(var i=0;i<lw.length;i++){var s=getWS(lw[i].word);if(s.n>0){learned++;if(s.n<=1)s1++;else if(s.n<=3)s2++;else s3++;}}
    var pct=lw.length>0?Math.round(learned/lw.length*100):0;
    h='<h3 style="font-size:14px;font-weight:600;margin:0 0 4px;">词汇进度</h3><div class="sub">'+lvl+' · '+learned+'/'+lw.length+'</div><div class="progress-bar" style="height:8px;"><div class="fill done" style="width:'+pct+'%"></div></div><div style="display:flex;gap:10px;margin-top:14px;"><div class="stat"><div class="n glow">'+s1+'</div><div class="l">刚学</div></div><div class="stat"><div class="n" style="color:var(--glow)">'+s2+'</div><div class="l">巩固中</div></div><div class="stat"><div class="n" style="color:var(--done)">'+s3+'</div><div class="l">已掌握</div></div></div>';
  }else{
    h='<h3 style="font-size:14px;font-weight:600;margin:0 0 4px;">备份</h3><div class="sub">导出CSV可编辑后重新导入</div><div style="display:flex;gap:10px;margin-top:12px;"><button class="btn-s" onclick="expCSV()">📥 导出Excel</button><button class="btn-s" onclick="document.getElementById(\'importFile\').click()">📤 导入</button></div><div style="text-align:center;font-size:11px;color:var(--paper-faint);margin-top:18px;">数据仅存在本设备，换机前请导出。</div>';
  }
  document.getElementById('revContent').innerHTML=h;
}
function expCSV(){
  var l=[['日期','单词','复习','精听','口语']],keys=Object.keys(D.rec).sort();
  for(var i=0;i<keys.length;i++){var k=keys[i],r=D.rec[k]||[];l.push([k,r.indexOf('word')!==-1?'✓':'',r.indexOf('review')!==-1?'✓':'',r.indexOf('listen')!==-1?'✓':'',r.indexOf('speak')!==-1?'✓':'']);}
  var csv='';for(var i=0;i<l.length;i++)csv+=l[i].join(',')+'\n';
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='英核_'+td()+'.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}
document.getElementById('importFile').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){
    var c=r.result;
    try{var o=JSON.parse(c);if(typeof o==='object'&&'rec'in o){if(!confirm('导入将覆盖当前数据，确定？'))return;D=o;if(!D.ws)D.ws={};sv(D);rToday();rVocab();rRev();alert('导入成功');e.target.value='';return;}}catch(er){}
    try{var ls=c.split('\n').filter(function(l){return l.trim();});if(ls.length<2)throw 0;
      var nd={start:null,rec:{},ws:D.ws,level:D.level,lu:D.lu||[]};
      for(var i=1;i<ls.length;i++){var col=ls[i].split(',');if(col.length<2)continue;var k=col[0].trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;var rec=[];if(col[1].trim()==='✓')rec.push('word');if(col[2].trim()==='✓')rec.push('review');if(col[3].trim()==='✓')rec.push('listen');if(col[4].trim()==='✓')rec.push('speak');if(rec.length>0){nd.rec[k]=rec;if(!nd.start||k<nd.start)nd.start=k;}}
      if(Object.keys(nd.rec).length===0)throw 0;if(!confirm('导入'+Object.keys(nd.rec).length+'天数据？'))return;D=nd;sv(D);rToday();rVocab();rRev();showD('✓','CSV导入成功');
    }catch(er2){showD('错误','文件格式不正确。');}
    e.target.value='';
  };r.readAsText(f);
});

function showD(t,b){document.getElementById('dTitle').textContent=t;document.getElementById('dBody').innerHTML=b;document.getElementById('dialog').classList.add('show');}
function closeD(){document.getElementById('dialog').classList.remove('show');}

function swT(idx){
  var tabs=document.querySelectorAll('.tab'),pages=document.querySelectorAll('.page');
  for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');
  for(var i=0;i<pages.length;i++)pages[i].classList.remove('active');
  tabs[idx].classList.add('active');var pg=tabs[idx].dataset.page;
  document.getElementById('page-'+pg).classList.add('active');
  if(pg==='today')rToday();if(pg==='vocab')rVocab();if(pg==='listen')rListen();if(pg==='speak')rSpeak();if(pg==='review')rRev();
}
(function(){var tabs=document.querySelectorAll('.tab');for(var i=0;i<tabs.length;i++)tabs[i].addEventListener('click',(function(idx){return function(){swT(idx);};})(i));})();

loadJ('vocab.json',function(d){vocabData=d;loadJ('sentences.json',function(s){sentData=s;rToday();});});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
